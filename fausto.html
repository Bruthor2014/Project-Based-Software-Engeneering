<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <main class="profile-card">
            <img src="fausto.png" alt="Member Photo" class="profile-img">
            <h1>Fausto Luís</h1>
            <p class="bio-text">"I am 21 years old, born in Lisbon. I study computer engineering and I am focused on building efficient software solutions."</p>

            <section class="skills-section">
                <h2>Technical Skills</h2>
                <div class="skills-list">
                    <span class="skill-tag">Software Engineering</span>
                    <span class="skill-tag">HTML/CSS</span>
                    <span class="skill-tag">Git/GitHub</span>
                    <span class="skill-tag">Project Management</span>
                </div>
            </section>

            <div class="social-links">
                <a href="#" class="btn-social btn-github">GitHub</a>
                <a href="#" class="btn-social btn-linkedin">LinkedIn</a>
            </div>
        </main>

        <footer>
            <a href="index.html" class="btn" style="background-color: #6c757d;">← Back to Home</a>
        </footer>
    </div>
</body>
</html>
